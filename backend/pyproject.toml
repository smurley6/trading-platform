[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-platform-backend"
version = "0.1.0"
description = "Multi-algorithm trading platform backend (hexagonal modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "DTZ", # naive datetimes forbidden
    "T20", # no print()
    "SIM", # simplify
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src/trading", "tests"]
warn_unreachable = true
# The plugin models pydantic-settings: required fields are env-populated, so `Settings()`
# is a valid no-arg call rather than a missing-argument error.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that hit real external boundaries (Postgres, Alpaca paper)",
]

[tool.coverage.run]
source = ["src/trading/domain", "src/trading/application"]

[tool.importlinter]
root_package = "trading"

[[tool.importlinter.contracts]]
name = "Hexagonal layering: dependencies point inward only"
type = "layers"
layers = [
    "trading.interface",
    "trading.infrastructure",
    "trading.application",
    "trading.strategies",
    "trading.domain",
]
