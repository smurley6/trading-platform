[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-platform-backend"
version = "0.1.0"
description = "Multi-algorithm trading platform backend (hexagonal modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "websockets>=13",
    "pyyaml>=6",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "types-PyYAML>=6",
    # Light, py.typed halves of the RL stack (task-rl-01). gymnasium's wheel is <1 MB and pulls no
    # torch; having it (and numpy) installed lets `class ...(gym.Env[...])` type-check under
    # `mypy --strict` instead of tripping disallow_subclassing_any on an `Any` base.
    "numpy>=1.26,<3",
    "gymnasium>=1.3,<2",
]
# Heavy, OFFLINE-only RL training stack (task-rl-01). Never installed by CI or Render; only
# `trading.rl` / `trading.jobs.rl_*` may import it (enforced by import-linter below).
rl = [
    "gymnasium>=1.3,<2",
    "stable-baselines3>=2.9,<3",
    "torch>=2.8,<3",
    "numpy>=1.26,<3",
    "tensorboard>=2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "DTZ", # naive datetimes forbidden
    "T20", # no print()
    "SIM", # simplify
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src/trading", "tests"]
warn_unreachable = true
# The plugin models pydantic-settings: required fields are env-populated, so `Settings()`
# is a valid no-arg call rather than a missing-argument error.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

# The heavy [rl] extra is absent in CI/dev, so these resolve to Any there. gymnasium and numpy are
# deliberately NOT listed: both ship py.typed and are installed via [dev].
[[tool.mypy.overrides]]
module = ["stable_baselines3.*", "torch.*"]
ignore_missing_imports = true

# strict enables warn_return_any; SB3/torch resolve to Any in CI where the rl extra is absent, so
# these two modules (the ONLY ones that touch SB3) get a narrow relaxation. Config override, NEVER
# an inline `# type: ignore` in trading/rl/** -- strict also sets warn_unused_ignores, so an ignore
# that is REQUIRED without the extra becomes an ERROR once a developer installs it.
[[tool.mypy.overrides]]
module = ["trading.rl.train", "trading.rl.export"]
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that hit real external boundaries (Postgres, Alpaca paper)",
    "live_smoke: tests that hit a real live external API (e.g. EDGAR); opt-in via RUN_LIVE_SMOKE",
    "rl: tests requiring the optional [rl] extra (torch/stable-baselines3); skipped without it",
]

[tool.coverage.run]
source = ["src/trading/domain", "src/trading/application"]

[tool.coverage.report]
# Spec 7.2: coverage gate on domain + application. Enforced by CI's `pytest --cov`
# (pytest-cov reads fail_under here and exits non-zero below it), so it actually blocks.
fail_under = 80

[tool.importlinter]
root_package = "trading"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layering: dependencies point inward only"
type = "layers"
layers = [
    "trading.interface",
    "trading.infrastructure",
    "trading.application",
    "trading.strategies",
    "trading.domain",
]

# task-rl-01: the heavy ML stack (and the trading.rl package that hosts it) must never be reachable
# from anything the web service / cron cycle imports. The layers contract above leaves unlisted
# siblings (trading.rl, trading.jobs, trading.main) unconstrained, so this makes the isolation
# enforced rather than accidental. Requires include_external_packages to name torch & co.
# trading.jobs as a WHOLE is deliberately absent from source_modules (jobs.rl_* MAY import
# trading.rl); the torch-free job entry points are listed individually so the deployed cron
# path is a source in its own right, not merely covered through trading.main.
[[tool.importlinter.contracts]]
name = "Heavy ML deps never enter the app import graph"
type = "forbidden"
source_modules = [
    "trading.domain",
    "trading.application",
    "trading.strategies",
    "trading.interface",
    "trading.infrastructure",
    "trading.main",
    "trading.jobs.cycle",
    "trading.jobs.backfill",
    "trading.jobs.label_outcomes",
    "trading.jobs.purge_synthetic",
    "trading.jobs.diagnostic",
    # task-rl-02: the dataset freeze is a pure fetch/serialize job (no ML) despite its rl_ prefix,
    # so it is held to the same wall as the other non-RL jobs.
    "trading.jobs.rl_dataset",
]
forbidden_modules = ["trading.rl", "torch", "stable_baselines3", "gymnasium", "numpy"]
