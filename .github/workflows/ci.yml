name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check (strict)
        run: mypy
      - name: Architecture check (hexagonal layering)
        run: lint-imports
      - name: Tests
        run: pytest --cov --cov-report=term-missing

  # Integration tests against Alpaca paper run only when secrets are configured (spec 7.4).
  integration:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_INTEGRATION == 'true' }}
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrate
        env:
          DATABASE_URL: postgresql+asyncpg://trading:trading@localhost:5432/trading
        run: alembic upgrade head
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://trading:trading@localhost:5432/trading
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: pytest tests -m integration
