repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # These run the project-aware checks from the active environment (PATH), so they work with
  # any venv location, pipx, or a system install — not a hardcoded backend/.venv path. Activate
  # the backend venv (or otherwise put mypy/lint-imports on PATH) before committing.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (backend)
        entry: bash -c 'cd backend && mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: import-linter
        name: import-linter (hexagonal layering)
        entry: bash -c 'cd backend && lint-imports'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: memory-md-updated
        name: MEMORY.md updated for architecture/API/config/deploy changes
        entry: bash scripts/check_memory_updated.sh
        language: system
        pass_filenames: false
        always_run: true
